server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA entry — must NEVER be cached. If the browser holds an old
    # index.html the user keeps loading old hashed asset names even after
    # a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Version manifest — frontend polls this to detect new deploys.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle assets are content-addressed and safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
