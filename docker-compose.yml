services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ec_dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ec_dashboard
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-real-32-char-secret}
      JWT_EXPIRE_DAYS: 7
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-cjx}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-please-set-a-strong-password}
      UPLOAD_MAX_MB: 20
      CORS_ORIGINS: '["http://localhost","http://localhost:9586"]'
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # Bind to loopback only so prod's Caddy can claim host :80. For local
    # docker-only testing visit http://127.0.0.1:8080 . In prod Caddy reaches
    # this container via the docker network (`frontend:80`) regardless.
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  pgdata:
