# Production override.
#
# Combined with the base file via:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Changes vs base:
#   - frontend's host port is removed (only Caddy is reachable from the internet)
#   - adds Caddy on :80 / :443 with automatic Let's Encrypt
#   - hardens restart policies

services:
  db:
    restart: always

  backend:
    restart: always

  frontend:
    # Strip the port binding from the base compose — Caddy is the only public ingress now.
    ports: []
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
