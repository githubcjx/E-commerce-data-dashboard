# Production override.
#
# Combined with the base file via:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Changes vs base:
#   - frontend's host port is removed (only Caddy is reachable from the internet)
#   - adds Caddy on :80 / :443 with automatic Let's Encrypt
#   - hardens restart policies

services:
  db:
    restart: always

  backend:
    restart: always

  frontend:
    # In compose v2 the `ports` array is concatenated by override, not replaced,
    # so we can't strip the base mapping here. Instead the base file binds
    # frontend to 127.0.0.1:8080 so it never conflicts with Caddy on :80.
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      # `:Z` relabels the file for SELinux (enforced on Alibaba Cloud Linux / Anolis).
      # On systems without SELinux the suffix is silently ignored.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
